<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>All Widgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            background: #f1f5f9;
            color: var(--text-main);
        }

        .app {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr) 340px;
            height: 100vh;
        }

        .sidebar {
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .sidebar-brand {
            padding: 1.4rem 1.2rem 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-brand h1 {
            font-family: var(--font-heading);
            color: #fff;
            font-size: 1.8rem;
            line-height: 1.1;
        }

        .sidebar-brand p {
            margin-top: 0.35rem;
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .sidebar-nav {
            overflow-y: auto;
            padding: 0.75rem 0 1.5rem;
            flex: 1;
        }

        .nav-section {
            margin: 0.85rem 0 0.25rem;
            padding: 0.55rem 1.1rem 0.2rem;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .nav-item {
            width: calc(100% - 16px);
            margin: 2px 8px;
            border: none;
            background: transparent;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.7rem 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-family: var(--font-body);
            font-size: 0.92rem;
            font-weight: 600;
            transition: background 0.15s, color 0.15s;
        }

        .nav-item i {
            width: 1.2rem;
            text-align: center;
            color: var(--primary-color);
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .nav-item.active {
            background: rgba(212, 36, 38, 0.18);
            color: #fff;
            box-shadow: inset 3px 0 0 var(--primary-color);
        }

        .workspace {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: #e2e8f0;
        }

        .workspace-header {
            padding: 1.15rem 1.5rem 0.9rem;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
        }

        .workspace-header h2 {
            font-size: 1.35rem;
            margin: 0;
        }

        .workspace-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .preview-stage {
            flex: 1;
            min-height: 0;
            margin: 1.25rem 1.5rem;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            background: #0f172a url('bg.avif') center / cover no-repeat;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
        }

        .preview-stage iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
        }

        .preview-empty {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 2rem;
            background: rgba(15, 23, 42, 0.35);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .preview-empty[hidden],
        iframe[hidden] {
            display: none !important;
        }

        .preview-empty i {
            font-size: 2.6rem;
            color: var(--primary-color);
            margin-bottom: 0.8rem;
        }

        .inspector {
            background: #fff;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .inspector-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1.2rem;
        }

        .inspector h3 {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-bottom: 1rem;
        }

        .inspector label {
            font-weight: 700;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .inspector input,
        .inspector select,
        .inspector textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            font-size: 0.95rem;
            font-family: var(--font-body);
            margin-bottom: 14px;
            background: #f8fafc;
        }

        .inspector input:focus,
        .inspector select:focus,
        .inspector textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #fff;
        }

        .hint {
            font-size: 0.82rem;
            color: #64748b;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem 0.85rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .channel-results {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 240px;
            overflow-y: auto;
            margin: -6px 0 14px;
        }

        .channel-result {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 1px solid #e2e8f0;
            background: #fff;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            text-align: left;
            font-family: var(--font-body);
        }

        .channel-result:hover,
        .channel-result.selected {
            border-color: var(--primary-color);
            background: #fff5f5;
        }

        .channel-result img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #e2e8f0;
            flex-shrink: 0;
        }

        .channel-result span {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
        }

        .channel-status {
            font-size: 0.8rem;
            color: #64748b;
            margin: -8px 0 12px;
        }

        .no-fields {
            color: #64748b;
            font-size: 0.9rem;
        }

        .inspector-actions {
            padding: 1rem 1.2rem 1.2rem;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 0.85rem;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: var(--font-body);
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: #fff;
        }

        .btn-primary:hover { background: #b01b1d; }
        .btn-primary:disabled,
        .btn-secondary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #0f172a;
            color: #fff;
        }

        .btn-secondary:hover { background: #1e293b; }
        .btn-secondary.copied { background: var(--accent-color); }

        @media (max-width: 1100px) {
            .app {
                grid-template-columns: 240px minmax(0, 1fr);
                grid-template-rows: 1fr auto;
            }
            .inspector {
                grid-column: 1 / -1;
                border-left: none;
                border-top: 1px solid #e2e8f0;
                max-height: 42vh;
            }
        }

        @media (max-width: 720px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { max-height: 38vh; }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>All Widgets</h1>
                <p>Choose, preview and copy</p>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
        </aside>

        <main class="workspace">
            <div class="workspace-header">
                <h2 id="widget-title">Select a widget</h2>
                <p id="widget-desc">Use the left menu to open a widget, customize it, and copy the OBS link.</p>
            </div>
            <div class="preview-stage">
                <div class="preview-empty" id="preview-empty">
                    <i class="fas fa-puzzle-piece"></i>
                    <strong>Nothing selected</strong>
                    <p>Click a widget in the menu to preview it here.</p>
                </div>
                <iframe id="preview-frame" title="Widget preview" hidden></iframe>
            </div>
        </main>

        <aside class="inspector">
            <div class="inspector-body">
                <h3>Customize</h3>
                <p class="hint" id="inspector-hint">Select a widget to edit its values while you preview it.</p>
                <form id="inspector-form">
                    <p class="no-fields">No widget selected.</p>
                </form>
            </div>
            <div class="inspector-actions">
                <button class="btn btn-primary" id="copy-btn" type="button" disabled>
                    <i class="fas fa-link"></i> Copy link
                </button>
            </div>
        </aside>
    </div>

                        fields: [
                            { key: 'text', label: 'Top text', placeholder: 'Event Starts In', value: 'Event Starts In' },
                            { key: 'size', label: 'Size', type: 'select', value: 'medium', options: [
                                { value: 'small', label: 'Small' },
                                { value: 'medium', label: 'Medium' },
                                { value: 'large', label: 'Large' }
                            ] },
                            { key: 'date', label: 'Target date and time', type: 'datetime-local' }
                        ]
                    }
                ]
            }
        ];

        const nav = document.getElementById('sidebar-nav');
        const form = document.getElementById('inspector-form');
        const hintEl = document.getElementById('inspector-hint');
        const titleEl = document.getElementById('widget-title');
        const descEl = document.getElementById('widget-desc');
        const frame = document.getElementById('preview-frame');
        const empty = document.getElementById('preview-empty');
        const copyBtn = document.getElementById('copy-btn');

        let active = null;
        let previewTimer = null;
        let searchTimer = null;
        let searchToken = 0;

        function allWidgets() {
            return SECTIONS.flatMap((section) => section.widgets);
        }

        function widgetUrl(widget, params = {}) {
            const base = new URL('widgets/' + widget.file, window.location.href).href;
            const search = new URLSearchParams();
            Object.entries(params).forEach(([key, value]) => {
                if (value !== undefined && value !== '') search.set(key, value);
            });
            const qs = search.toString();
            return qs ? `${base}?${qs}` : base;
        }

        function collectParams() {
            const params = {};
            form.querySelectorAll('[name]').forEach((el) => {
                const field = active?.fields.find((item) => item.key === el.name);
                if (field && !fieldVisible(field)) return;
                params[el.name] = el.value;
            });
            return params;
        }

        function fieldVisible(field) {
            if (!field.showWhen) return true;
            const dep = form.querySelector(`[name="${field.showWhen.key}"]`);
            return !!(dep && dep.value === field.showWhen.value);
        }

        function missingRequired() {
            if (!active) return true;
            return active.fields.some((field) => {
                if (!fieldVisible(field)) return false;
                const el = form.querySelector(`[name="${field.key}"]`);
                return el && el.required && !el.value.trim();
            });
        }

        function syncFieldVisibility() {
            if (!active) return;
            active.fields.forEach((field) => {
                const el = form.querySelector(`[name="${field.key}"]`);
                if (!el) return;
                const visible = fieldVisible(field);
                const label = el.previousElementSibling;
                el.style.display = visible ? '' : 'none';
                if (label && label.tagName === 'LABEL') label.style.display = visible ? '' : 'none';
            });
        }

        function updatePreview() {
            if (!active) return;
            if (missingRequired()) {
                frame.hidden = true;
                empty.hidden = false;
                empty.innerHTML = '<i class="fas fa-pen"></i><strong>Missing details</strong><p>Fill in the fields on the right to see the preview.</p>';
                return;
            }
            empty.hidden = true;
            frame.hidden = false;
            frame.src = widgetUrl(active, collectParams());
        }

        function schedulePreview() {
            clearTimeout(previewTimer);
            previewTimer = setTimeout(updatePreview, 350);
        }

        function timezoneOptions() {
            const zones = (typeof Intl !== 'undefined' && Intl.supportedValuesOf)
                ? Intl.supportedValuesOf('timeZone')
                : ['UTC', 'Europe/London', 'Europe/Madrid', 'Europe/Paris', 'America/New_York', 'America/Los_Angeles', 'America/Mexico_City', 'America/Sao_Paulo', 'Asia/Tokyo', 'Asia/Shanghai', 'Australia/Sydney'];
            return zones.map((zone) => ({
                value: zone,
                label: zone.replace(/_/g, ' ')
            }));
        }

        function buildField(field) {
            if (field.type === 'channel') {
                buildChannelField(field);
                return;
            }

            const label = document.createElement('label');
            label.textContent = field.label;
            form.appendChild(label);

            let input;
            if (field.type === 'textarea') {
                input = document.createElement('textarea');
                input.rows = 4;
            } else if (field.type === 'select' || field.type === 'timezone') {
                input = document.createElement('select');
                const options = field.type === 'timezone'
                    ? timezoneOptions()
                    : (field.options || []);
                options.forEach((opt) => {
                    const option = document.createElement('option');
                    option.value = opt.value;
                    option.textContent = opt.label;
                    input.appendChild(option);
                });
            } else {
                input = document.createElement('input');
                input.type = field.type || 'text';
            }
            input.name = field.key;
            input.placeholder = field.placeholder || '';
            input.required = field.required !== false;
            if (field.value) input.value = field.value;
            if ((field.type === 'datetime-local' || field.type === 'date') && !input.value) {
                const initDate = new Date();
                initDate.setDate(initDate.getDate() + 1);
                initDate.setMinutes(initDate.getMinutes() - initDate.getTimezoneOffset());
                input.value = field.type === 'date'
                    ? initDate.toISOString().slice(0, 10)
                    : initDate.toISOString().slice(0, 16);
            }
            input.addEventListener('input', () => {
                syncFieldVisibility();
                schedulePreview();
            });
            input.addEventListener('change', () => {
                syncFieldVisibility();
                schedulePreview();
            });
            form.appendChild(input);
        }

        function buildChannelField(field) {
            const label = document.createElement('label');
            label.textContent = field.label;
            form.appendChild(label);

            const search = document.createElement('input');
            search.type = 'search';
            search.placeholder = field.placeholder || 'Type a channel name';
            search.autocomplete = 'off';
            form.appendChild(search);

            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = field.key;
            hidden.required = true;
            form.appendChild(hidden);

            const status = document.createElement('p');
            status.className = 'channel-status';
            status.textContent = 'Start typing a channel name.';
            form.appendChild(status);

            const results = document.createElement('div');
            results.className = 'channel-results';
            form.appendChild(results);

            const avatarImg = (src) => {
                const img = document.createElement('img');
                img.alt = '';
                img.referrerPolicy = 'no-referrer';
                img.loading = 'lazy';
                img.src = src || '';
                return img;
            };

            const pickChannel = (name, id, thumb) => {
                hidden.value = id;
                search.value = name;
                status.textContent = 'Selected: ' + name;
                results.innerHTML = '';
                const chosen = document.createElement('button');
                chosen.type = 'button';
                chosen.className = 'channel-result selected';
                const nameEl = document.createElement('span');
                nameEl.textContent = name;
                chosen.appendChild(avatarImg(thumb));
                chosen.appendChild(nameEl);
                results.appendChild(chosen);
                schedulePreview();
            };

            const renderResults = (list) => {
                results.innerHTML = '';
                if (!list.length) {
                    status.textContent = 'No channels found.';
                    return;
                }
                status.textContent = 'Pick a channel:';
                list.slice(0, 12).forEach((item) => {
                    const name = item[0] || 'Unknown';
                    const thumb = item[1] || '';
                    const id = item[2] || '';
                    if (!id) return;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'channel-result';
                    const nameEl = document.createElement('span');
                    nameEl.textContent = name;
                    btn.appendChild(avatarImg(thumb));
                    btn.appendChild(nameEl);
                    btn.addEventListener('click', () => pickChannel(name, id, thumb));
                    results.appendChild(btn);
                });
            };

            search.addEventListener('input', () => {
                const query = search.value.trim();
                hidden.value = '';
                clearTimeout(searchTimer);
                if (query.length < 2) {
                    results.innerHTML = '';
                    status.textContent = 'Type at least 2 characters.';
                    schedulePreview();
                    return;
                }
                status.textContent = 'Searching...';
                const token = ++searchToken;
                searchTimer = setTimeout(async () => {
                    try {
                        const res = await fetch(`https://mixerno.space/api/youtube-channel-counter/search/${encodeURIComponent(query)}`);
                        const data = await res.json();
                        if (token !== searchToken) return;
                        renderResults(Array.isArray(data?.list) ? data.list : []);
                    } catch (err) {
                        if (token !== searchToken) return;
                        results.innerHTML = '';
                        status.textContent = 'Search failed. Try again.';
                        console.error(err);
                    }
                }, 350);
            });
        }

        function selectWidget(id) {
            const widget = allWidgets().find((item) => item.id === id);
            if (!widget) return;
            active = widget;

            document.querySelectorAll('.nav-item').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.widget === id);
            });

            titleEl.textContent = widget.title;
            descEl.textContent = widget.desc;
            hintEl.textContent = widget.hint || 'Changes show instantly in the preview.';
            form.innerHTML = '';

            if (!widget.fields.length) {
                form.innerHTML = '<p class="no-fields">This widget does not need extra setup.</p>';
            } else {
                widget.fields.forEach(buildField);
                syncFieldVisibility();
            }

            copyBtn.disabled = false;
            updatePreview();
        }

        SECTIONS.forEach((section) => {
            const heading = document.createElement('div');
            heading.className = 'nav-section';
            heading.innerHTML = `<i class="fas ${section.icon}"></i> ${section.title}`;
            nav.appendChild(heading);
            section.widgets.forEach((widget) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'nav-item';
                btn.dataset.widget = widget.id;
                const family = widget.iconFamily || 'fas';
                btn.innerHTML = `<i class="${family} ${widget.icon}"></i><span>${widget.title}</span>`;
                btn.addEventListener('click', () => selectWidget(widget.id));
                nav.appendChild(btn);
            });
        });

        copyBtn.addEventListener('click', async () => {
            if (!active || missingRequired()) return;
            await navigator.clipboard.writeText(widgetUrl(active, collectParams()));
            const original = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied';
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.innerHTML = original;
                copyBtn.classList.remove('copied');
            }, 1800);
        });
    </script>
</body>

</html>
